name: Backend CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Autoriser Maven Wrapper
        run: chmod +x mvnw

      - name: Compiler et lancer les tests
        run: ./mvnw -B test
