spring.application.name=DentFlowBack

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.grynxldxewwmfrirpfvg}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Pratique pour le developpement : Hibernate cree et met a jour les tables manquantes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT signe et verifie uniquement par le backend Spring.
# JWT_SECRET doit contenir au moins 32 octets aleatoires encodes en Base64.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:http://localhost:8080}
app.jwt.expiration=30m

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
