spring.application.name=DentFlowBack

# 8080 est utilise par un autre projet local : DentFlow ecoute sur 8081.
server.port=${SERVER_PORT:8081}

# Par defaut : base PostgreSQL locale lancee avec "docker compose up -d".
# Pour pointer ailleurs (Supabase, prod...), definir les variables DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dentflow}
spring.datasource.username=${DB_USERNAME:dentflow}
spring.datasource.password=${DB_PASSWORD:dentflow}

# Pratique pour le developpement : Hibernate cree et met a jour les tables manquantes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT signe et verifie uniquement par le backend Spring.
# JWT_SECRET doit contenir au moins 32 octets aleatoires encodes en Base64.
# La valeur par defaut ci-dessous sert uniquement au developpement local.
app.jwt.secret=${JWT_SECRET:mR10bBNMTgkzJTiQGAe7dODtK1LP08DW1ViNYHPKorKIKHzbTPhJFoRjdLmiju32}
app.jwt.issuer=${JWT_ISSUER:http://localhost:8081}
app.jwt.expiration=30m

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
